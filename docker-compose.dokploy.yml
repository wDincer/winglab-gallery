name: winglab-gallery
services:
  gallery:
    build: .
    expose:
      - "8080"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-dokploy-network}"
      traefik.http.services.winglab-gallery.loadbalancer.server.port: "8080"
      traefik.http.routers.winglab-gallery-http.rule: "Host(`${APP_DOMAIN:?Set APP_DOMAIN in Dokploy Environment}`)"
      traefik.http.routers.winglab-gallery-http.entrypoints: web
      traefik.http.routers.winglab-gallery-http.service: winglab-gallery
      traefik.http.routers.winglab-gallery-http.middlewares: winglab-gallery-https-redirect
      traefik.http.middlewares.winglab-gallery-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.winglab-gallery-https-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.winglab-gallery-https.rule: "Host(`${APP_DOMAIN:?Set APP_DOMAIN in Dokploy Environment}`)"
      traefik.http.routers.winglab-gallery-https.entrypoints: websecure
      traefik.http.routers.winglab-gallery-https.service: winglab-gallery
      traefik.http.routers.winglab-gallery-https.tls: "true"
      traefik.http.routers.winglab-gallery-https.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"

networks:
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-dokploy-network}"
